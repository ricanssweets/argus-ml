[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-quant"
version = "0.1.0"
description = "Deterministic quantitative library for the ARGUS prediction platform"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml-extra = ["xgboost", "lightgbm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
